name: sahlha
description: Sahlha — adaptive learning app for every learner.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.7.0
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + routing + networking
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^15.1.2
  dio: ^5.7.0

  # Storage / files / media
  flutter_secure_storage: ^9.2.2
  file_picker: ^8.1.2
  just_audio: ^2.12.0

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  fl_chart: ^0.69.0

  # Models
  collection: ^1.18.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1
  riverpod_lint: ^2.3.13

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
